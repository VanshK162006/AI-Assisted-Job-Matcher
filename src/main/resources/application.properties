spring.application.name=job-finder-ai


# ---------- Database (MySQL + Hibernate) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/practise_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:order}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database_platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JWT (read by JwtServices) ----------
# Must be at least 32 characters, or the app refuses to start.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=60

# ---------- Spring AI: Gemini through the OpenAI-compatible starter ----------
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.options.model=gemini-3.5-flash-lite

#Public API keys
app.greenhouse.api="https://boards-api.greenhouse.io/v1/boards/stripe/jobs?content=true"
app.lever.api=https://api.lever.co/v0/postings/spotify?mode=json
app.ashbyhq.api=https://api.ashbyhq.com/posting-api/job-board/openai

#
pipeline.cron=0 0 7 * * *
pipeline.zone=Asia/Kolkata
pipeline.pause-millis=500

filter.max-years=2

# Role phrases only. Do NOT use bare level words like intern/associate/fresher.
filter.include-title-words=java, java developer, java intern, java trainee, java fresher, junior java developer, \
  spring boot, springboot, spring developer, backend, back end, back-end, backend developer, backend intern, \
  software developer, software engineer, software engineer intern, software development intern, sde, sde intern, sde 1, sde-1, sde i, \
  associate software engineer, associate engineer, associate software developer, graduate engineer trainee, \
  software engineer trainee, trainee software engineer, junior software engineer, junior developer, \
  application developer, api developer, rest api, full stack java, java full stack, fullstack java, \
  hibernate, jpa, microservices intern, 2027 batch, 2027 graduate

# Seniority + non-tech roles that kept leaking through
filter.exclude-title-words=senior, sr, staff, principal, lead, manager, director, head, architect, vp, iii, iv, \
  hr, human resources, recruiter, recruitment, talent acquisition, onboarding, \
  sales, marketing, growth, business development, bde, telecaller, collections, customer support, customer service, \
  customer success, voice process, non voice, bpo, call center, insurance, field executive, content writer, \
  accountant, auditor, data entry, operations executive, \
  .net, php, android, ios, sap, salesforce, devops, qa, tester, testing

filter.india-location-words=india, remote, work from home, wfh, hybrid, mumbai, navi mumbai, thane, mumbai central, goregaon, \
  pune, bengaluru, bangalore, hyderabad, chennai


telegram.enabled=true
telegram.bot-token=#{TELEGRAM_BOT_TOKEN}
telegram.chat-id=${TELEGRAM_CHAT_ID:null}
telegram.min-score=20
telegram.max-jobs-per-message=20

agent.enabled=true
agent.max-tool-calls=8
agent.max-message-chars=500
agent.max-results-per-tool=15
agent.max-remembered-turn=6
