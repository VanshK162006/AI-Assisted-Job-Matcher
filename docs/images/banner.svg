<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="bannerTitle bannerDesc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="bannerTitle">Job Finder AI</title>
  <desc id="bannerDesc">Official company job boards, then a smart filter, then an AI match score, then a Telegram alert.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- soft decorative circles -->
  <circle cx="1090" cy="60" r="130" fill="#ffffff" opacity="0.05"/>
  <circle cx="1140" cy="280" r="95" fill="#ffffff" opacity="0.06"/>
  <circle cx="70" cy="300" r="85" fill="#ffffff" opacity="0.04"/>

  <!-- logo mark: magnifier with a check -->
  <g transform="translate(78,70)">
    <circle cx="52" cy="52" r="40" fill="none" stroke="#5eead4" stroke-width="10"/>
    <line x1="82" y1="82" x2="116" y2="116" stroke="#5eead4" stroke-width="12" stroke-linecap="round"/>
    <path d="M33 54 L48 69 L73 39" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="232" y="128" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="700" fill="#ffffff">Job Finder AI</text>
  <text x="234" y="176" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Find real tech jobs early. Match them to your profile with AI.</text>

  <!-- pipeline chips -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">
    <rect x="234" y="218" width="250" height="46" rx="23" fill="#ffffff" fill-opacity="0.14" stroke="#5eead4" stroke-opacity="0.6"/>
    <text x="359" y="248" text-anchor="middle">Official job boards</text>

    <line x1="490" y1="241" x2="526" y2="241" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="534" y="218" width="170" height="46" rx="23" fill="#ffffff" fill-opacity="0.14" stroke="#5eead4" stroke-opacity="0.6"/>
    <text x="619" y="248" text-anchor="middle">Smart filter</text>

    <line x1="710" y1="241" x2="746" y2="241" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="754" y="218" width="190" height="46" rx="23" fill="#ffffff" fill-opacity="0.14" stroke="#5eead4" stroke-opacity="0.6"/>
    <text x="849" y="248" text-anchor="middle">AI match score</text>

    <line x1="950" y1="241" x2="986" y2="241" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="994" y="218" width="170" height="46" rx="23" fill="#ffffff" fill-opacity="0.14" stroke="#5eead4" stroke-opacity="0.6"/>
    <text x="1079" y="248" text-anchor="middle">Telegram</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
