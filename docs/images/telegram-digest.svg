<svg xmlns="http://www.w3.org/2000/svg" width="640" height="884" viewBox="0 0 640 884" role="img" aria-labelledby="tgTitle tgDesc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="tgTitle">Telegram digest example</title>
  <desc id="tgDesc">Illustration of the Telegram message the bot sends: a bold count header, then numbered job matches with company, location, colour-coded match score, skill gaps, a collapsible description and an Open posting link, followed by a "more waiting" footer. Example data only.</desc>

  <defs>
    <linearGradient id="tgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.6" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.22"/>
    </linearGradient>
    <mask id="tgQuoteMask" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="82">
      <rect width="640" height="82" fill="url(#tgFade)"/>
    </mask>
    <linearGradient id="tgBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1621"/>
      <stop offset="1" stop-color="#0b121b"/>
    </linearGradient>
  </defs>

  <rect width="640" height="884" rx="22" fill="url(#tgBg)"/>

  <!-- chat header -->
  <rect width="640" height="72" rx="22" fill="#17212b"/>
  <rect y="40" width="640" height="32" fill="#17212b"/>
  <circle cx="44" cy="36" r="22" fill="#2b87d1"/>
  <g transform="translate(32,24)" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="7"/>
    <line x1="17.5" y1="17.5" x2="23" y2="23"/>
    <path d="M8.5 12.2 L11 14.7 L15.6 9.4"/>
  </g>
  <text x="80" y="32" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Job Finder Bot</text>
  <text x="80" y="54" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6d7f8f">bot</text>

  <!-- message bubble -->
  <rect x="40" y="104" width="560" height="696" rx="18" fill="#182533"/>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif" font-size="17" fill="#e8eef5">

    <!-- header -->
    <text x="64" y="146" font-size="21" font-weight="700">🎯 2 new job matches</text>

    <!-- ============ match #1 ============ -->
    <text x="64" y="190" font-size="18" font-weight="700">#1 · 💼 Java Developer</text>
    <text x="64" y="216"><tspan font-weight="700">🏢 Company:</tspan> Acme Pay</text>
    <text x="64" y="240"><tspan font-weight="700">📍 Location:</tspan> Mumbai, India</text>
    <text x="64" y="264"><tspan font-weight="700">⭐ Match:</tspan> 🟢 92%</text>
    <text x="64" y="288"><tspan font-weight="700">🧩 Gaps:</tspan> Kafka</text>
    <text x="64" y="314"><tspan font-weight="700">📝 Description:</tspan></text>

    <!-- collapsed expandable quote -->
    <g transform="translate(0,326)">
      <g mask="url(#tgQuoteMask)">
        <rect x="64" y="0" width="504" height="82" rx="6" fill="#6ab3f3" fill-opacity="0.10"/>
        <rect x="64" y="0" width="4" height="82" rx="2" fill="#6ab3f3"/>
        <g font-size="15.5" fill="#d3dde8">
          <text x="82" y="24">Build and scale payment microservices using Java 17,</text>
          <text x="82" y="46">Spring Boot and MySQL. You will own REST APIs end to</text>
          <text x="82" y="68">end, write unit tests, review code and ship features</text>
        </g>
      </g>
      <path d="M538 62 L545 69 L552 62" fill="none" stroke="#6ab3f3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="64" y="436"><tspan font-weight="700">🔗 Link:</tspan> <tspan fill="#6ab3f3">Open posting →</tspan></text>

    <!-- ============ match #2 ============ -->
    <text x="64" y="484" font-size="18" font-weight="700">#2 · 💼 Backend Engineer</text>
    <text x="64" y="510"><tspan font-weight="700">🏢 Company:</tspan> Example Labs</text>
    <text x="64" y="534"><tspan font-weight="700">📍 Location:</tspan> Remote, India</text>
    <text x="64" y="558"><tspan font-weight="700">⭐ Match:</tspan> 🟡 68%</text>
    <text x="64" y="582"><tspan font-weight="700">🧩 Gaps:</tspan> Docker, AWS</text>
    <text x="64" y="608"><tspan font-weight="700">📝 Description:</tspan></text>

    <g transform="translate(0,620)">
      <g mask="url(#tgQuoteMask)">
        <rect x="64" y="0" width="504" height="82" rx="6" fill="#6ab3f3" fill-opacity="0.10"/>
        <rect x="64" y="0" width="4" height="82" rx="2" fill="#6ab3f3"/>
        <g font-size="15.5" fill="#d3dde8">
          <text x="82" y="24">Design secure REST APIs with Spring Boot and JWT, tune</text>
          <text x="82" y="46">Hibernate queries and help move services to Docker on</text>
          <text x="82" y="68">AWS. Strong OOP and DBMS fundamentals are expected.</text>
        </g>
      </g>
      <path d="M538 62 L545 69 L552 62" fill="none" stroke="#6ab3f3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="64" y="730"><tspan font-weight="700">🔗 Link:</tspan> <tspan fill="#6ab3f3">Open posting →</tspan></text>

    <!-- footer -->
    <text x="64" y="778" fill="#8ba0b4">… and 3 more waiting. See /api/matches</text>
  </g>

  <text x="578" y="778" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6d7f8f">07:02</text>

  <text x="320" y="848" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6d7f8f">Illustration with example data. Companies and scores are fictional.</text>
</svg>
