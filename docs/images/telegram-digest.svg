<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" role="img" aria-labelledby="tgTitle tgDesc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="tgTitle">Telegram digest example</title>
  <desc id="tgDesc">Illustration of the Telegram message the bot sends: two job matches with score, company, location, missing skills and an Apply link. Example data only.</desc>

  <rect width="640" height="540" rx="22" fill="#0e1621"/>

  <!-- chat header -->
  <rect width="640" height="72" rx="22" fill="#17212b"/>
  <rect y="40" width="640" height="32" fill="#17212b"/>
  <circle cx="44" cy="36" r="22" fill="#2b87d1"/>
  <g transform="translate(32,24)" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="7"/>
    <line x1="17.5" y1="17.5" x2="23" y2="23"/>
    <path d="M8.5 12.2 L11 14.7 L15.6 9.4"/>
  </g>
  <text x="80" y="32" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff">Job Finder Bot</text>
  <text x="80" y="54" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6d7f8f">bot</text>

  <!-- message bubble -->
  <rect x="40" y="104" width="560" height="352" rx="18" fill="#182533"/>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#e8eef5">
    <!-- target icon + title -->
    <g transform="translate(68,138)" fill="none" stroke="#ff6b6b" stroke-width="2.4">
      <circle cx="0" cy="0" r="11"/>
      <circle cx="0" cy="0" r="6"/>
      <circle cx="0" cy="0" r="1.6" fill="#ff6b6b"/>
    </g>
    <text x="92" y="145" font-size="21" font-weight="700">2 new job matches</text>

    <!-- match 1 -->
    <text x="64" y="195"><tspan>1.  </tspan><tspan font-weight="700">92</tspan><tspan> · Java Developer</tspan></text>
    <text x="88" y="223" fill="#8ba0b4">Acme Pay · Mumbai, India</text>
    <text x="88" y="251" fill="#8ba0b4">Missing: Kafka</text>
    <text x="88" y="279" fill="#6ab3f3" text-decoration="underline">Apply</text>

    <!-- match 2 -->
    <text x="64" y="333"><tspan>2.  </tspan><tspan font-weight="700">81</tspan><tspan> · Backend Engineer</tspan></text>
    <text x="88" y="361" fill="#8ba0b4">Example Labs · Bengaluru, India</text>
    <text x="88" y="389" fill="#8ba0b4">Missing: Docker, AWS</text>
    <text x="88" y="417" fill="#6ab3f3" text-decoration="underline">Apply</text>
  </g>

  <text x="578" y="440" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6d7f8f">07:02</text>

  <text x="320" y="504" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6d7f8f">Illustration with example data. Companies and scores are fictional.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
